services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: loyalty_local_only
      POSTGRES_DB: loyalty
    volumes:
      - loyalty_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty -d loyalty"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  loyalty_db:
